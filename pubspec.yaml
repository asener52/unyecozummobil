name: unyecozum_mobil
description: Ünye Belediyesi Çözüm Merkezi Mobil Uygulaması
publish_to: 'none'
version: 1.1.0+22

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # HTTP Client
  dio: ^5.4.3

  # State Management
  provider: ^6.1.2

  # Routing
  go_router: ^14.2.0

  # Secure Storage (JWT token)
  flutter_secure_storage: ^9.2.2

  # Local Storage
  shared_preferences: ^2.2.3

  # UI / Icons
  cupertino_icons: ^1.0.6
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Forms & Input
  image_picker: ^1.1.2
  file_picker: ^8.0.3

  # Date & Time
  intl: ^0.20.2

  # Utilities
  url_launcher: ^6.3.0
  connectivity_plus: ^6.0.3
  path_provider: ^2.1.4
  open_filex: ^4.5.0

  # Biyometrik kimlik doğrulama
  local_auth: ^2.3.0

  # Charts
  fl_chart: ^0.69.0

  # Uygulama sürümü bilgisi (Profil ekranı)
  package_info_plus: ^8.0.2

  # İzin yönetimi (Android 13+ bildirim izni)
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#1a6b3c"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
